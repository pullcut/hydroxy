[package]
name = "hydroxy-dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Accessible UI components for Dioxus (web, desktop, mobile), built on hydroxy state machines and headless connectors."
readme = "README.md"
keywords = ["dioxus", "ui", "components", "accessibility", "headless"]
categories = ["gui", "web-programming", "wasm"]

[dependencies]
hydroxy-statechart.workspace = true
hydroxy-headless = { workspace = true, features = ["markdown"] }
hydroxy-tokens.workspace = true
hydroxy-charts.workspace = true
dioxus = { workspace = true, features = ["lib"] }

[features]
default = ["full"]
full = ["forms", "overlays", "navigation", "display", "data", "chat", "activity", "layout", "feedback", "charts"]
# Groups mirror the docs sidebar. A group lists the groups its modules import.
display = []
layout = []
feedback = ["display"]
overlays = ["display", "forms"]
forms = ["display", "feedback", "navigation", "overlays"]
navigation = ["display", "forms", "overlays"]
data = ["display", "forms", "navigation", "overlays"]
chat = ["data", "display", "forms", "overlays"]
activity = ["chat", "display"]
charts = ["data", "display"]

[lints]
workspace = true

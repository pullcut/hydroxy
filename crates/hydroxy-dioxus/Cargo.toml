[package]
name = "hydroxy-dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Accessible UI components for Dioxus (web, desktop, mobile), built on hydroxy state machines and headless connectors."
readme = "README.md"
keywords = ["dioxus", "ui", "components", "accessibility", "headless"]
categories = ["gui", "web-programming", "wasm"]

[dependencies]
hydroxy-statechart.workspace = true
hydroxy-headless = { workspace = true, features = ["markdown"] }
hydroxy-tokens.workspace = true
hydroxy-charts.workspace = true
dioxus = { workspace = true, features = ["lib"] }

[features]
default = ["full"]
full = ["forms", "overlays", "navigation", "display", "data", "chat", "activity", "layout", "feedback", "charts"]
# Groups are additive and acyclic. Button and IconButton are always compiled. A group lists only
# the groups its own components need; a component that composes several groups (say
# `command_palette`, overlays + forms) is gated on all of them in lib.rs instead.
display = []
layout = []
overlays = []
charts = []
feedback = ["display"]
forms = ["display"]
navigation = ["overlays"]
data = ["display", "forms"]
chat = ["display", "forms"]
activity = ["display"]

[lints]
workspace = true

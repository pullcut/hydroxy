[package]
name = "hydroxy-leptos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Accessible UI components for Leptos, built on hydroxy state machines and headless connectors. Works with server rendering."
readme = "README.md"
keywords = ["leptos", "ui", "components", "accessibility", "headless"]
categories = ["gui", "web-programming", "wasm"]

[dependencies]
hydroxy-statechart.workspace = true
hydroxy-headless.workspace = true
hydroxy-charts.workspace = true
hydroxy-pacer = { workspace = true, features = ["leptos"] }
leptos.workspace = true
web-sys.workspace = true

[lints]
workspace = true

[features]
default = ["full"]
full = ["forms", "overlays", "navigation", "display", "data", "chat", "activity", "layout", "feedback", "charts"]
# Groups mirror the docs sidebar. A group lists the groups its modules import.
display = []
layout = []
feedback = ["display"]
overlays = ["display", "forms"]
forms = ["display", "feedback", "navigation", "overlays"]
navigation = ["display", "forms", "overlays"]
data = ["display", "forms", "navigation", "overlays"]
chat = ["data", "display", "forms", "overlays"]
activity = ["chat", "display"]
charts = ["data", "display"]

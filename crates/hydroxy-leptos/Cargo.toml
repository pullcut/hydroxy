[package]
name = "hydroxy-leptos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Accessible UI components for Leptos, built on hydroxy state machines and headless connectors. Works with server rendering."
readme = "README.md"
keywords = ["leptos", "ui", "components", "accessibility", "headless"]
categories = ["gui", "web-programming", "wasm"]

[dependencies]
hydroxy-statechart.workspace = true
hydroxy-headless = { workspace = true, features = ["markdown"] }
hydroxy-tokens.workspace = true
hydroxy-charts.workspace = true
hydroxy-pacer = { workspace = true, features = ["leptos"] }
leptos.workspace = true
web-sys = { workspace = true, features = [
    "AnalyserNode",
    "AudioContext",
    "Blob",
    "BlobEvent",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "ContextAttributes2d",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomException",
    "DomRect",
    "DragEvent",
    "Element",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "ImageData",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "KeyboardEvent",
    "MediaDevices",
    "MediaQueryList",
    "MediaRecorder",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MouseEvent",
    "MutationObserver",
    "MutationObserverInit",
    "Navigator",
    "Node",
    "NodeList",
    "Performance",
    "PointerEvent",
    "ProgressEvent",
    "Range",
    "RecordingState",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Selection",
    "Storage",
    "TimeRanges",
    "Url",
    "WheelEvent",
    "Window",
] }

[lints]
workspace = true

[features]
default = ["full"]
full = ["forms", "overlays", "navigation", "display", "data", "chat", "activity", "layout", "feedback", "charts"]
# Groups are additive and acyclic. Button and IconButton are always compiled. A group lists only
# the groups its own components need; a component that composes several groups (say
# `command_palette`, overlays + forms) is gated on all of them in lib.rs instead.
display = []
layout = []
overlays = []
charts = []
feedback = ["display"]
forms = ["display"]
navigation = ["overlays"]
data = ["display", "forms"]
chat = ["display", "forms"]
activity = ["display"]

[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
oxide-statechart = { path = "crates/oxide-statechart" }
oxide-machines = { path = "crates/oxide-machines" }
oxide-headless = { path = "crates/oxide-headless" }
oxide-tokens = { path = "crates/oxide-tokens" }
oxide-leptos = { path = "crates/oxide-leptos" }
oxide-dioxus = { path = "crates/oxide-dioxus" }
oxide-charts = { path = "crates/oxide-charts" }
pulldown-cmark = { version = "0.13", default-features = false }
leptos = "0.8.22"
dioxus = { version = "0.7.10", default-features = false }
web-sys = { version = "0.3", features = ["HtmlElement", "HtmlDialogElement", "Navigator", "Clipboard", "DataTransfer", "DragEvent", "FileList", "File", "DomRect", "HtmlInputElement"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Smaller, faster WASM for the docs site; native builds benefit too.
[profile.release]
lto = true
codegen-units = 1
strip = true

# The docs site's browser bundle: smallest wasm rather than fastest code.
# Used by cargo-leptos for `--release` builds (lib-profile-release).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pullcut/oxide"
authors = ["Tom Deakin"]
rust-version = "1.89"

[workspace.dependencies]
oxide-statechart = { path = "crates/oxide-statechart", version = "0.1.0" }
oxide-machines = { path = "crates/oxide-machines", version = "0.1.0" }
oxide-headless = { path = "crates/oxide-headless", version = "0.1.0" }
oxide-tokens = { path = "crates/oxide-tokens", version = "0.1.0" }
oxide-leptos = { path = "crates/oxide-leptos", version = "0.1.0" }
oxide-dioxus = { path = "crates/oxide-dioxus", version = "0.1.0" }
oxide-charts = { path = "crates/oxide-charts", version = "0.1.0" }
pulldown-cmark = { version = "0.13", default-features = false }
leptos = "0.8.22"
dioxus = { version = "0.7.10", default-features = false }
web-sys = { version = "0.3", features = ["Selection", "Range", "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack", "MediaRecorder", "RecordingState", "BlobEvent", "Blob", "BlobPropertyBag", "AudioContext", "AnalyserNode", "MediaStreamAudioSourceNode", "AudioNode", "Performance", "Window", "DomException", "HtmlMediaElement", "TimeRanges", "HtmlElement", "HtmlDialogElement", "Navigator", "Clipboard", "DataTransfer", "DragEvent", "FileList", "File", "DomRect", "HtmlInputElement", "MediaQueryList", "Storage","IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "Url", "NodeList", "HtmlAnchorElement", "WheelEvent", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "CssStyleDeclaration", "ResizeObserver", "ResizeObserverEntry", "MutationObserver", "MutationObserverInit", "MutationRecord"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Keep line numbers for backtraces but drop full debug info, and none for
# dependencies: dev builds come out roughly 40% smaller on disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Smaller, faster WASM for the docs site; native builds benefit too.
[profile.release]
lto = true
codegen-units = 1
strip = true

# The docs site's browser bundle: smallest wasm rather than fastest code.
# Used by cargo-leptos for `--release` builds (lib-profile-release).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

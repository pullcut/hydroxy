[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pullcut/hydroxy"
authors = ["Tom Deakin"]
rust-version = "1.89"

[workspace.dependencies]
hydroxy-statechart = { path = "crates/hydroxy-statechart", version = "0.1.0" }
hydroxy-machines = { path = "crates/hydroxy-machines", version = "0.1.0" }
hydroxy-headless = { path = "crates/hydroxy-headless", version = "0.1.0" }
hydroxy-tokens = { path = "crates/hydroxy-tokens", version = "0.1.0" }
hydroxy-leptos = { path = "crates/hydroxy-leptos", version = "0.1.0", default-features = false }
hydroxy-dioxus = { path = "crates/hydroxy-dioxus", version = "0.1.0", default-features = false }
hydroxy-charts = { path = "crates/hydroxy-charts", version = "0.1.0" }
hydroxy-pacer = { path = "crates/hydroxy-pacer", version = "0.1.0" }
hydroxy-hotkeys = { path = "crates/hydroxy-hotkeys", version = "0.1.0" }
hydroxy-virtual = { path = "crates/hydroxy-virtual", version = "0.1.0" }
hydroxy-state = { path = "crates/hydroxy-state", version = "0.1.0" }
pulldown-cmark = { version = "0.13", default-features = false }
leptos = "0.8.22"
dioxus = { version = "0.7.10", default-features = false }
js-sys = "0.3"
criterion = "0.5"
web-sys = "0.3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

# Keep line numbers for backtraces but drop full debug info, and none for
# dependencies: dev builds come out roughly 40% smaller on disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Smaller, faster WASM for the docs site; native builds benefit too.
[profile.release]
lto = true
codegen-units = 1
strip = true

# The docs site's browser bundle: smallest wasm rather than fastest code.
# Used by cargo-leptos for `--release` builds (lib-profile-release).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

# The docs server only runs to pre-render pages (apps/docs/export.sh), so build it fast.
# Used by cargo-leptos for `--release` builds (bin-profile-release).
[profile.server-release]
inherits = "release"
lto = false
codegen-units = 256
opt-level = 1
strip = false

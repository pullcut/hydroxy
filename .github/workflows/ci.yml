name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check -p hydroxy-leptos --each-feature --no-dev-deps
      - run: cargo hack check -p hydroxy-dioxus --each-feature --no-dev-deps

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p hydroxy-docs --features hydrate --target wasm32-unknown-unknown
      - run: cargo check -p dioxus-gallery

  msrv:
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml, which pins stable.
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@trunk
      - name: Build the size probe and compare with the recorded size
        working-directory: examples/size-probe
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
          CARGO_PROFILE_RELEASE_PANIC: abort
        run: |
          trunk build --release
          size=$(stat -c %s dist/*.wasm)
          echo "wasm: $size bytes"
          if [ -f wasm-size-budget.txt ]; then
            budget=$(cat wasm-size-budget.txt)
            limit=$((budget + budget / 10))
            if [ "$size" -gt "$limit" ]; then
              echo "wasm grew past 10% over the recorded $budget bytes"
              exit 1
            fi
          else
            echo "no wasm-size-budget.txt yet; record $size there to enable the check"
          fi

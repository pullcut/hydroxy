name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude dioxus-gallery --all-targets --all-features -- -D warnings

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check -p hydroxy-leptos --each-feature --no-dev-deps
      - run: cargo hack check -p hydroxy-dioxus --each-feature --no-dev-deps

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude dioxus-gallery --all-features

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p hydroxy-docs --features hydrate --target wasm32-unknown-unknown

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --exclude hydroxy-docs --exclude dioxus-gallery --exclude size-probe
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  # Playwright against the docs site; the config starts `cargo leptos serve` itself.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/docs/e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Build first so the server starts well inside Playwright's webServer timeout.
      - run: cargo leptos build
        working-directory: apps/docs
      - run: npx playwright test

  # The gallery is a desktop app: it needs GTK and WebKit to build.
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p dioxus-gallery --all-targets -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml, which pins stable.
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude dioxus-gallery --all-features

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Keep in step with the wasm-bindgen version in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build the size probe and compare with the recorded size
        run: |
          cargo build -p size-probe --profile wasm-release --target wasm32-unknown-unknown
          # Measure what ships: wasm-bindgen drops its own metadata section (over half the raw file).
          wasm-bindgen --target web --out-dir probe-out target/wasm32-unknown-unknown/wasm-release/size-probe.wasm
          size=$(stat -c %s probe-out/size-probe_bg.wasm)
          budget=$(cat examples/size-probe/wasm-size-budget.txt)
          limit=$((budget + budget / 10))
          echo "wasm: $size bytes (budget $budget, limit $limit)"
          if [ "$size" -gt "$limit" ]; then
            echo "wasm grew more than 10% past the budget"
            exit 1
          fi

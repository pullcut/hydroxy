# cargo-deny: the `deny` CI job runs `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained, not vulnerable, and only reachable through the frameworks. Drop each once
# upstream moves off it.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: via leptos (either_of)" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash: via dioxus-desktop (wry, selectors)" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: via dioxus-desktop on Linux (gtk 0.18)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "NCSA",
]
confidence-threshold = 0.9

# Apps and examples are publish = false and carry no license field.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

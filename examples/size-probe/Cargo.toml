[package]
name = "size-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Smallest useful hydroxy app (one Button, one LineChart), built to measure wasm size."

[dependencies]
# Button is always compiled; `charts` alone adds LineChart and nothing from the other groups.
hydroxy-leptos = { workspace = true, features = ["charts"] }
leptos = { workspace = true, features = ["csr"] }

[lints]
workspace = true
